name: CI

# Quality gates: lint the Python, prove the package installs and imports,
# and validate the plugin + marketplace manifests.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint & import (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install --upgrade "ruff==0.15.15"
      - name: Ruff (lint)
        run: ruff check .
      - name: Byte-compile
        run: python -m py_compile src/google_workspace_mcp/*.py
      - name: Install package
        run: python -m pip install .
      - name: Import smoke test
        run: |
          python -c "from google_workspace_mcp import server, authorize, accounts, auth; import google_workspace_mcp; print('ok', google_workspace_mcp.__version__)"
          google-workspace-authorize 2>&1 | grep -q usage || true
      - name: Tests
        run: |
          python -m pip install pytest
          python -m pytest tests -q
      - name: Validate JSON manifests
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json accounts.example.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1])); print(sys.argv[1], 'ok')" "$f"
          done
      - name: Versions agree (5 manifest fields + uv.lock)
        run: |
          python3 - <<'EOF'
          import json, re, sys, tomllib
          marketplace = json.load(open(".claude-plugin/marketplace.json"))
          lock = tomllib.load(open("uv.lock", "rb"))
          versions = {
              ".claude-plugin/plugin.json": json.load(open(".claude-plugin/plugin.json"))["version"],
              ".claude-plugin/marketplace.json version": marketplace["version"],
              ".claude-plugin/marketplace.json plugins[0].version": marketplace["plugins"][0]["version"],
              "pyproject.toml": tomllib.load(open("pyproject.toml", "rb"))["project"]["version"],
              "src/google_workspace_mcp/__init__.py": re.search(
                  r'__version__ = "([^"]+)"',
                  open("src/google_workspace_mcp/__init__.py").read()).group(1),
              # Not hand-edited — stale whenever `uv lock` was skipped.
              "uv.lock (run `uv lock`)": next(
                  p["version"] for p in lock["package"]
                  if p["name"] == "google-workspace-mcp"),
          }
          pad = max(map(len, versions))
          for name, value in versions.items():
              print(f"  {name:<{pad}}  {value}")
          distinct = sorted(set(versions.values()))
          if len(distinct) > 1:
              print(f"\n::error::Version mismatch {distinct}. A user-facing change must bump all "
                    "five manifest fields and re-run `uv lock` (see CONTRIBUTING.md). Note that "
                    "plugins[0].version is also enforced by 'claude plugin validate --strict'.")
              sys.exit(1)
          print(f"\nAll copies agree: {distinct[0]}")
          EOF

      - name: README catalog covers every tool
        run: |
          python3 - <<'EOF'
          import re, sys
          # server.py is the source of truth. CONTRIBUTING requires every new tool
          # to reach the README catalog and the advertised total to stay honest;
          # 0.5.0 and 0.6.0 each broke one of those silently, so assert both.
          tools = re.findall(r'@mcp\.tool\(\)\s*\n\s*(?:async\s+)?def\s+(\w+)',
                             open("src/google_workspace_mcp/server.py").read())
          readme = open("README.md").read()
          failed = False

          missing = [t for t in tools if f"`{t}`" not in readme]
          if missing:
              print(f"::error::{len(missing)} tool(s) missing from the README catalog: "
                    f"{', '.join(missing)}. Add a row to the matching table.")
              failed = True

          claims = {
              "the 'tools across four services' bullet": r"\*\*(\d+) tools across four services\*\*",
              "the repository-layout comment": r"the MCP server . all (\d+) tools",
          }
          for where, pattern in claims.items():
              found = re.search(pattern, readme)
              if not found:
                  print(f"::error::Could not find {where} in README.md. If you reworded it, "
                        "update this step's pattern to match.")
                  failed = True
              elif int(found.group(1)) != len(tools):
                  print(f"::error::README.md claims {found.group(1)} tools in {where}, but "
                        f"server.py defines {len(tools)}. Update the README.")
                  failed = True

          if failed:
              sys.exit(1)
          print(f"  {len(tools)} tools, all present in the catalog and both totals agree")
          EOF

  plugin:
    name: Validate plugin manifest
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin
        run: claude plugin validate . --strict
